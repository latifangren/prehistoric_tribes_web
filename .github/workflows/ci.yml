name: CI - Quality & Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Check file size ceilings
        run: npm run check:size

      - name: Reject raised file size ceilings on pull requests
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'feat') && github.head_ref != 'dev'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run check:size -- --compare-ref "origin/$BASE_REF"

      - name: Reject raised file size ceilings on pushes
        if: github.event_name == 'push'
        run: npm run check:size -- --compare-ref HEAD^

      - name: Typecheck TypeScript
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Run verification test suites
        run: npm test
      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke
        run: npm run test:browser --workspace=web
