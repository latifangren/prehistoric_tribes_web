<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Accessibility (branch harden/audit-fixes): browser zoom is no
         longer disabled page-wide. The game screen itself still locks
         pinch / double-tap (see main.ts) because pinch is the map zoom
         and double-tap is select-all in-game; dialogs and menus outside
         the screen element are now free to use browser zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.png" />
    <!-- Played as a home-screen app, portrait only (phase 3): full screen, the status bar over the
         page, whose notch strip WideScreen.ts fills with the resource bar's colour. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tribes" />
    <meta name="theme-color" content="#bfb04d" />
    <meta name="description" content="A faithful web port of the classic 2000s J2ME strategy game Prehistoric Tribes with HD art, touch controls, and Simplified Chinese support." />
    <meta property="og:title" content="Prehistoric Tribes Web" />
    <meta property="og:description" content="A faithful web port of the classic 2000s J2ME strategy game Prehistoric Tribes with HD art, touch controls, and Simplified Chinese support." />
    <title>Prehistoric Tribes Web</title>
  </head>
  <body>
    <main id="app" aria-label="Prehistoric Tribes game"></main>
    <div class="rotate-notice" role="alert">Please rotate your device to portrait mode</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
